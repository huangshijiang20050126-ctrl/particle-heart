<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030713">
  <meta name="description" content="一颗会跳动的星光爱心，送给想念的人。">
  <meta name="referrer" content="no-referrer">
  <title>星河情书</title>
  <style>
    :root{color-scheme:dark;--ink:#edf5ff;--muted:#a9bad5;--accent:#8acaff;--line:#273952}
    *{box-sizing:border-box}
    body{margin:0;background:#030713;color:var(--ink);font:16px/1.5 "PingFang SC","Microsoft YaHei",sans-serif}
    button,input,textarea{font:inherit}
    button{cursor:pointer;color:var(--ink);min-height:46px;padding:8px 16px;border:1px solid var(--line);border-radius:999px;background:#0c1729}
    button:hover{border-color:#82baff;background:#172a44}
    :focus-visible{outline:2px solid #b4dbff;outline-offset:3px}
    .scene{min-height:100vh;min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;position:relative;isolation:isolate;
      padding:calc(22px + env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) calc(26px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));
      background:radial-gradient(ellipse at 50% 48%,#112854 0%,#070f25 54%,#030713 88%)}
    canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1;touch-action:none}
    header,.bottom{pointer-events:none}
    header button,.bottom button{pointer-events:auto}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;width:min(100%,1160px);margin-inline:auto}
    .brand{letter-spacing:.18em;font-size:16px;display:flex;align-items:center;gap:10px}
    .brand span{color:#a3d8ff;font-size:23px;text-shadow:0 0 16px #58a8ff}
    .tools,.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
    .stage{min-height:250px;pointer-events:none}
    .bottom{text-align:center;width:min(100%,680px);margin-inline:auto}
    h1{font-family:"Songti SC",STSong,SimSun,serif;font-size:clamp(26px,5.4vw,48px);font-weight:500;line-height:1.2;letter-spacing:.09em;margin:0;overflow-wrap:anywhere}
    .message{margin:10px 0 17px;color:#c1d5f0;white-space:pre-wrap;overflow-wrap:anywhere;max-height:4.6em;overflow:auto;pointer-events:auto}
    .hint{color:var(--muted);font-size:14px;margin:13px 0 0}
    .primary{background:#d8edff;color:#0b2546;border-color:#d8edff;font-weight:650}
    .primary:hover{background:#f1f8ff;color:#0b2546}
    dialog{color:var(--ink);background:#0b1527;border:1px solid #344e70;border-radius:24px;width:min(520px,calc(100% - 28px));padding:22px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto}
    dialog::backdrop{background:#020510b8}
    .dialog-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
    h2{font-size:22px;margin:0}
    label{display:grid;gap:5px;font-size:15px}
    .fields{display:grid;gap:13px}
    input,textarea{color:inherit;background:#061020;border:1px solid #344e70;border-radius:10px;padding:9px 10px;width:100%;min-height:44px}
    textarea{resize:vertical;min-height:72px}
    input[type=color]{width:100%;padding:4px}
    input[type=file]{font-size:14px}
    .colors{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .dialog-actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:16px}
    .note{color:var(--muted);font-size:14px;margin:8px 0 0}
    .toast{position:fixed;z-index:1;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);padding:9px 15px;border:1px solid #3d5e86;border-radius:12px;background:#0b1527;text-align:center;pointer-events:none}
    .toast:empty{display:none}
    #shareLink{margin-top:8px}
    @media(max-width:420px){header button,.actions button{padding-inline:12px}.scene{padding-inline:14px}.brand{gap:5px;letter-spacing:.1em}}
  </style>
</head>
<body>
  <main class="scene" id="scene">
    <canvas id="sky" aria-hidden="true"></canvas>
    <header>
      <div class="brand"><span aria-hidden="true">✦</span>星河情书</div>
      <div class="tools">
        <button id="music" type="button" aria-pressed="false">播放音乐</button>
        <button id="edit" type="button">自定义</button>
      </div>
    </header>
    <div class="stage" aria-hidden="true"></div>
    <section class="bottom" aria-label="星河情书">
      <h1 id="dedication"></h1>
      <p class="message" id="message"></p>
      <div class="actions">
        <button class="primary" id="burst" type="button">绽放心愿</button>
        <button id="morph" type="button" aria-pressed="false">粒子成字</button>
        <button id="share" type="button">分享</button>
      </div>
      <p class="hint" id="gesture">轻点星空触发绽放 · 拖动旋转爱心</p>
    </section>
  </main>
  <dialog id="editor" aria-labelledby="editTitle">
    <form id="settings">
      <div class="dialog-head"><h2 id="editTitle">写下你的心意</h2><button id="dismiss" type="button">取消</button></div>
      <div class="fields">
        <label>对方的名字<input id="nameInput" maxlength="24" placeholder="你" autocomplete="off"></label>
        <label>表白文字<textarea id="textInput" maxlength="120" rows="2" required></textarea></label>
        <div class="colors">
          <label>粒子颜色<input type="color" id="colorInput"></label>
          <label>高光颜色<input type="color" id="lightInput"></label>
        </div>
        <label>可分享的音乐链接<input id="urlInput" type="url" inputmode="url" maxlength="400" placeholder="https://…/music.mp3"></label>
        <label>从这台设备选择音乐<input id="fileInput" type="file" accept="audio/*"></label>
      </div>
      <p class="note">留空时播放内置旋律。本地音乐只在这台设备本次打开时有效。分享音乐请使用可直接播放的 HTTPS 音频链接。</p>
      <div class="dialog-actions">
        <button id="reset" type="button">恢复默认</button>
        <button class="primary" type="submit">保存心意</button>
      </div>
    </form>
  </dialog>
  <dialog id="sharing" aria-labelledby="shareTitle">
    <div class="dialog-head"><h2 id="shareTitle">分享这封情书</h2><button id="closeShare" type="button">关闭</button></div>
    <p class="note" id="shareNote"></p>
    <input id="shareLink" readonly aria-label="分享链接">
    <div class="dialog-actions"><button id="copy" class="primary" type="button">复制链接</button></div>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <audio id="track" preload="none" loop></audio>
  <script>
    'use strict';
    const $ = id => document.getElementById(id);
    const defaults = { name:'', text:'愿你永远快乐', color:'#2d82ff', light:'#d7efff', music:'' };
    const cleanColor = (value, fallback) => /^#[\da-f]{6}$/i.test(value || '') ? value : fallback;
    function musicUrl(value) {
      if (!value || value.length > 400) return '';
      try {
        const url = new URL(value);
        return url.protocol === 'https:' && !url.username && !url.password ? url.href : '';
      } catch { return ''; }
    }
    const incoming = new URLSearchParams(location.hash.slice(1));
    let config = {
      name:(incoming.get('name') || '').trim().slice(0,24),
      text:(incoming.get('text') || '').trim().slice(0,120) || defaults.text,
      color:cleanColor(incoming.get('color'),defaults.color),
      light:cleanColor(incoming.get('light'),defaults.light),
      music:musicUrl(incoming.get('music'))
    };
    const canvas = $('sky'), ctx = canvas.getContext('2d', {alpha:true}), scene = $('scene');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)');
    const coarse = matchMedia('(pointer: coarse)').matches;
    const random = (min,max) => min + Math.random() * (max - min);
    const tau = Math.PI * 2;
    const curve = [], lengths = [0];
    for (let i=0;i<=2048;i++) {
      const t = i*tau/2048;
      const x = 16*Math.sin(t)**3;
      const y = -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
      if (i) lengths.push(lengths[i-1]+Math.hypot(x-curve[i-1][0],y-curve[i-1][1]));
      curve.push([x,y]);
    }
    function heartPoint() {
      const distance = random(0,lengths.at(-1));
      let left=0, right=lengths.length-1;
      while (left<right) {
        const middle=(left+right)>>1;
        if (lengths[middle]<distance) left=middle+1;
        else right=middle;
      }
      return curve[left];
    }
    const particles = Array.from({length:coarse?2600:4800},()=>{
      const [x,y]=heartPoint(), radius=random(.52,1), size=Math.random();
      return {
        x:x*radius,y:(y-2)*radius,z:random(-7,7)*Math.sqrt(1-radius*radius),
        dx:random(-1,1),dy:random(-1,1),dz:random(-1,1),phase:random(0,tau),
        size:size<.69?0:size<.97?1:2,tx:0,ty:0
      };
    });
    const stars = Array.from({length:coarse?130:300},()=>({
      x:Math.random(),y:Math.random(),phase:random(0,tau),size:random(.45,1.45)
    }));
    function glow(radius) {
      const image = document.createElement('canvas');
      image.width=image.height=32;
      const paint=image.getContext('2d');
      const gradient=paint.createRadialGradient(16,16,0,16,16,16);
      gradient.addColorStop(0,config.light);
      gradient.addColorStop(.22,config.light+'cc');
      gradient.addColorStop(.43,config.color+'85');
      gradient.addColorStop(1,config.color+'00');
      paint.fillStyle=gradient;
      paint.fillRect(0,0,32,32);
      return {image,radius};
    }
    let sprites, width, height, centerX, centerY, stageScale, dpr;
    let elapsed=0, angle=0, dragAngle=0, tilt=0, morph=0, showingText=false, burstAge=10, meteorAge=9;
    let meteorX=0, meteorY=0, nextMeteor=2;
    function resize() {
      const frame=scene.getBoundingClientRect(), stage=document.querySelector('.stage').getBoundingClientRect();
      width=frame.width;
      height=frame.height;
      centerX=width/2;
      centerY=stage.top-frame.top+stage.height*.51;
      stageScale=Math.min(width/42,stage.height/31,22);
      dpr=Math.min(devicePixelRatio || 1,coarse?1.5:2);
      canvas.width=Math.round(width*dpr);
      canvas.height=Math.round(height*dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    function buildTextPoints() {
      const mask=document.createElement('canvas');
      mask.width=640;
      mask.height=224;
      const pen=mask.getContext('2d',{willReadFrequently:true});
      const raw=config.text.replace(/\s+/g,' ');
      const chars=Array.from(raw);
      const lineLength=Math.min(12,Math.ceil(chars.length/Math.min(3,Math.ceil(chars.length/12))));
      const lines=[];
      for (let i=0;i<chars.length && lines.length<3;i+=lineLength) {
        lines.push(chars.slice(i,i+lineLength).join(''));
      }
      if (chars.length>lineLength*3) lines[2]=Array.from(lines[2]).slice(0,-1).join('')+'…';
      pen.font='700 54px "Microsoft YaHei","PingFang SC",sans-serif';
      pen.textAlign='center';
      pen.textBaseline='middle';
      pen.fillStyle='#fff';
      lines.forEach((line,i)=>pen.fillText(line,320,112+(i-(lines.length-1)/2)*64,600));
      const pixels=pen.getImageData(0,0,640,224).data, points=[];
      for (let y=0;y<224;y+=2) for (let x=0;x<640;x+=2) {
        if (pixels[(y*640+x)*4+3]>110) points.push([(x-320)/17,(y-112)/17]);
      }
      for (const p of particles) {
        const point=points[Math.floor(Math.random()*points.length)] || [0,0];
        [p.tx,p.ty]=point;
      }
    }
    function applyConfig() {
      $('dedication').textContent='致 '+(config.name || '你');
      $('message').textContent=config.text;
      sprites=[glow(1.65),glow(2.65),glow(4.4)];
      buildTextPoints();
      resize();
    }
    let previous=0;
    function draw(now) {
      const dt=previous?Math.min(.04,(now-previous)/1000):0;
      previous=now;
      const still=reduced.matches;
      elapsed+=dt;
      if (!still && !pointer) angle+=dt*.45;
      burstAge+=dt;
      morph+=((showingText?1:0)-morph)*Math.min(1,dt*(still?20:4));
      const cycle=elapsed%14;
      const automatic=!still && cycle>8 && cycle<12 ? Math.sin(Math.PI*(cycle-8)/4)**2 : 0;
      const duration=still?.6:3.5;
      const manual=burstAge<duration ? Math.sin(Math.PI*burstAge/duration)*(still?.13:1) : 0;
      const expansion=Math.max(automatic,manual)*(1-morph);
      const scale=stageScale*(still?1:1+.045*Math.sin(elapsed*4)+.018*Math.sin(elapsed*8));
      const ca=Math.cos(angle+dragAngle),sa=Math.sin(angle+dragAngle);
      const ct=Math.cos(tilt),st=Math.sin(tilt);
      ctx.clearRect(0,0,width,height);
      ctx.fillStyle='#b6d5ff';
      for (const star of stars) {
        ctx.globalAlpha=still?.32:.32+.23*Math.sin(elapsed*1.8+star.phase);
        ctx.fillRect(star.x*width,star.y*height,star.size,star.size);
      }
      ctx.globalAlpha=1;
      if (!still && elapsed>=nextMeteor) {
        meteorX=random(.43,.98)*width;
        meteorY=random(.08,.28)*height;
        meteorAge=0;
        nextMeteor=elapsed+random(3,7);
      }
      meteorAge+=dt;
      if (!still && meteorAge<1.35) {
        const x=meteorX-meteorAge*410,y=meteorY+meteorAge*195;
        const trail=ctx.createLinearGradient(x,y,x+68,y-32);
        trail.addColorStop(0,'#bde8ff');
        trail.addColorStop(1,'#8acaff00');
        ctx.globalAlpha=1-meteorAge/1.35;
        ctx.strokeStyle=trail;
        ctx.lineWidth=1.2;
        ctx.beginPath();
        ctx.moveTo(x,y);
        ctx.lineTo(x+68,y-32);
        ctx.stroke();
      }
      ctx.fillStyle=config.color;
      for (let i=0;i<150;i++) {
        const a=i*tau/150+(still?0:elapsed*.15);
        const x=Math.cos(a)*stageScale*20.5,y=Math.sin(a)*stageScale*5.2;
        ctx.globalAlpha=(.12+.1*(1+Math.sin(a*3)))*(1-morph);
        ctx.fillRect(centerX+x*.94-y*.34,centerY+x*.34+y*.94,1.2,1.2);
      }
      ctx.globalCompositeOperation='lighter';
      for (const p of particles) {
        const wave=still?0:Math.sin(elapsed*1.7+p.phase);
        const x=p.x+p.dx*expansion*25+wave*.17;
        const y=p.y+p.dy*expansion*25;
        const z=p.z+p.dz*expansion*20;
        const rotatedX=x*ca+z*sa, rotatedZ=-x*sa+z*ca;
        const depth=y*st+rotatedZ*ct;
        const perspective=70/Math.max(20,70+depth);
        const fx=centerX+rotatedX*scale*perspective*(1-morph)+p.tx*stageScale*morph;
        const fy=centerY+(y*ct-rotatedZ*st)*scale*perspective*(1-morph)+p.ty*stageScale*morph;
        if (fx<-8 || fx>width+8 || fy<-8 || fy>height+8) continue;
        const sprite=sprites[p.size], r=sprite.radius*(.82+perspective*.18);
        ctx.globalAlpha=Math.min(.88,.44+perspective*.18+wave*.10);
        ctx.drawImage(sprite.image,fx-r,fy-r,r*2,r*2);
      }
      ctx.globalAlpha=1;
      ctx.globalCompositeOperation='source-over';
      requestAnimationFrame(draw);
    }
    function setMorph(value) {
      showingText=value;
      $('morph').setAttribute('aria-pressed',String(value));
      $('morph').textContent=value?'回到爱心':'粒子成字';
    }
    function burst() {
      setMorph(false);
      burstAge=0;
    }
    let pointer=null;
    canvas.addEventListener('pointerdown',event=>{
      if (!event.isPrimary || event.button!==0) return;
      pointer={id:event.pointerId,x:event.clientX,y:event.clientY,angle:dragAngle,tilt,moved:false};
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener('pointermove',event=>{
      if (pointer?.id!==event.pointerId) return;
      const dx=event.clientX-pointer.x,dy=event.clientY-pointer.y;
      if (Math.hypot(dx,dy)>8) pointer.moved=true;
      if (!pointer.moved) return;
      setMorph(false);
      dragAngle=pointer.angle+dx*.012;
      tilt=Math.max(-.85,Math.min(.85,pointer.tilt+dy*.01));
    });
    canvas.addEventListener('pointerup',event=>{
      if (pointer?.id!==event.pointerId) return;
      if (!pointer.moved) burst();
      pointer=null;
    });
    canvas.addEventListener('lostpointercapture',()=>{pointer=null});
    $('burst').addEventListener('click',burst);
    $('morph').addEventListener('click',()=>setMorph(!showingText));
    let timer;
    function notify(message) {
      $('toast').textContent=message;
      clearTimeout(timer);
      timer=setTimeout(()=>$('toast').textContent='',3500);
    }
    const track=$('track');
    let localMusic='', builtIn='';
    function melody() {
      if (builtIn) return builtIn;
      const rate=22050, length=rate*16, data=new DataView(new ArrayBuffer(44+length*2));
      for (const [offset,word] of [[0,'RIFF'],[8,'WAVE'],[12,'fmt '],[36,'data']]) {
        for (let i=0;i<word.length;i++) data.setUint8(offset+i,word.charCodeAt(i));
      }
      for (const [offset,value] of [[4,36+length*2],[16,16],[24,rate],[28,rate*2],[40,length*2]]) data.setUint32(offset,value,true);
      for (const [offset,value] of [[20,1],[22,1],[32,2],[34,16]]) data.setUint16(offset,value,true);
      const notes=[60,67,72,76,71,67,62,67,57,64,69,72,65,60,67,64,53,60,65,69,72,69,65,60,55,62,67,71,74,71,67,62];
      const samples=new Float32Array(length);
      notes.forEach((note,i)=>{
        const frequency=440*2**((note-69)/12), start=i*rate/2;
        for (let j=0;j<rate*1.6;j++) {
          const t=j/rate, phase=t*tau*frequency;
          const envelope=Math.min(t/.025,1)*Math.exp(-3.1*t)*(1-t/1.6);
          samples[(start+j)%length]+=.15*envelope*(Math.sin(phase)+.24*Math.sin(phase*2)+.075*Math.sin(phase*3));
        }
      });
      samples.forEach((sample,i)=>data.setInt16(44+i*2,Math.round(sample*32767),true));
      builtIn=URL.createObjectURL(new Blob([data],{type:'audio/wav'}));
      return builtIn;
    }
    function updateMusic() {
      $('music').textContent=track.paused?'播放音乐':'暂停音乐';
      $('music').setAttribute('aria-pressed',String(!track.paused));
    }
    track.addEventListener('playing',updateMusic);
    track.addEventListener('pause',updateMusic);
    $('music').addEventListener('click',async ()=>{
      if (!track.paused) {
        track.pause();
        return;
      }
      const source=localMusic || config.music || melody();
      if (track.src!==source) track.src=source;
      try { await track.play(); } catch {
        updateMusic();
        notify('音乐播放失败，请检查音频文件或链接。');
      }
    });
    const editor=$('editor'), form=$('settings'), sharing=$('sharing');
    let clearLocal=false;
    function fillForm(values) {
      $('nameInput').value=values.name;
      $('textInput').value=values.text;
      $('colorInput').value=values.color;
      $('lightInput').value=values.light;
      $('urlInput').value=values.music;
      $('urlInput').setCustomValidity('');
      $('fileInput').value='';
    }
    function shareURL() {
      const url=new URL(location.href), params=new URLSearchParams();
      for (const [key,value] of Object.entries(config)) if (value!==defaults[key]) params.set(key,value);
      url.hash=params.toString();
      return url.href;
    }
    $('edit').addEventListener('click',()=>{
      clearLocal=false;
      fillForm(config);
      editor.showModal();
    });
    $('dismiss').addEventListener('click',()=>editor.close());
    $('reset').addEventListener('click',()=>{
      clearLocal=true;
      fillForm(defaults);
    });
    $('urlInput').addEventListener('input',()=>$('urlInput').setCustomValidity(''));
    form.addEventListener('submit',event=>{
      event.preventDefault();
      const raw=$('urlInput').value.trim(), music=musicUrl(raw);
      if (raw && !music) {
        $('urlInput').setCustomValidity('请输入可直接播放的 HTTPS 音频链接。');
        $('urlInput').reportValidity();
        return;
      }
      const file=$('fileInput').files[0];
      if (clearLocal || file || music!==config.music) {
        track.pause();
        track.removeAttribute('src');
        track.load();
        if (localMusic) URL.revokeObjectURL(localMusic);
        localMusic=file?URL.createObjectURL(file):'';
      }
      config={
        name:$('nameInput').value.trim(),text:$('textInput').value.trim() || defaults.text,
        color:$('colorInput').value,light:$('lightInput').value,music
      };
      const url=shareURL();
      try { history.replaceState(null,'',url); } catch { location.hash=new URL(url).hash; }
      applyConfig();
      editor.close();
      notify('心意已保存');
    });
    $('share').addEventListener('click',()=>{
      const online=location.protocol==='https:' || location.protocol==='http:';
      $('shareLink').hidden=!online;
      $('copy').hidden=!online;
      $('shareLink').value=online?shareURL():'';
      $('shareNote').textContent=online
        ? '复制链接后粘贴到微信聊天。名字、文字和配色会随链接一起分享。'+(localMusic?' 本地音乐不会随链接分享。':'')
        : '当前打开的是电脑上的文件。请用发布后的网页地址生成微信分享链接。';
      sharing.showModal();
    });
    $('closeShare').addEventListener('click',()=>sharing.close());
    $('copy').addEventListener('click',async ()=>{
      const field=$('shareLink');
      try {
        await navigator.clipboard.writeText(field.value);
        $('shareNote').textContent='链接已复制，可以粘贴到微信聊天。';
      } catch {
        field.focus();
        field.select();
        field.setSelectionRange(0,field.value.length);
        $('shareNote').textContent='请长按链接并选择复制。';
      }
    });
    new ResizeObserver(resize).observe(document.querySelector('.stage'));
    window.addEventListener('resize',resize);
    applyConfig();
    requestAnimationFrame(draw);
